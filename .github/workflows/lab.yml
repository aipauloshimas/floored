            Get-ChildItem -LiteralPath $d -File -ErrorAction SilentlyContinue | Where-Object { $_.BaseName -match '^(python[0-9.]*|pythonw|py|pyw|pip[0-9.]*|node|npm|npx|corepack|ffmpeg|ffprobe|ffplay)$' } | ForEach-Object { Away $_.FullName }
          }
          foreach ($f in 'C:\Windows\py.exe', 'C:\Windows\pyw.exe') { Away $f }
          "--- manifest:"; Get-Content $manifest -ErrorAction SilentlyContinue
          exit 0

      - name: prove it is bare
