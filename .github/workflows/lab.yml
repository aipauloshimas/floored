# A lab workflow. It runs only on branches named lab/... and is never part of main.
# Probe: what do GitHub's clean runners have, and how close can they come to a creator's computer that has
# no Python, no Node.js, no ffmpeg and (on a Mac) no developer tools? No secrets, standard runners only.
name: lab

on:
  push:
    branches: ['lab/**']

permissions:
  contents: read

jobs:
  probe-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: what this machine has
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          "$($os.Caption) $($os.Version)"
          foreach ($t in 'winget','python','python3','py','node','npm','ffmpeg','ffprobe','choco','git') {
            $c = Get-Command $t -ErrorAction SilentlyContinue
            if ($c) { "$t -> $($c.Source)" } else { "$t -> (not found)" }
          }
          "--- PATH entries with python, node, ffmpeg, toolcache or chocolatey:"
          $env:PATH -split ';' | Where-Object { $_ -match 'python|node|ffmpeg|toolcache|chocolatey' }
          "--- browsers:"
          "chrome: $(Test-Path 'C:\Program Files\Google\Chrome\Application\chrome.exe')"
          "edge:   $(Test-Path 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe')"
          "--- the app aliases folder (where a home PC keeps the Store's python stub):"
          Get-ChildItem "$env:LOCALAPPDATA\Microsoft\WindowsApps" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
          "--- Python folders an installer would use:"
          Get-ChildItem "$env:LOCALAPPDATA\Programs\Python" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
          Get-ChildItem 'C:\Program Files' -Filter 'Python3*' -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
      - name: winget, as it answers the first time
        continue-on-error: true
        timeout-minutes: 5
        run: |
          winget --version
          "exit code: $LASTEXITCODE"
          winget source list
          "exit code: $LASTEXITCODE"
      - name: the command floored prints today, with no agreement flags (Python)
        continue-on-error: true
        timeout-minutes: 8
        run: |
          winget install --id Python.Python.3.12 -e
          "exit code: $LASTEXITCODE"
      - name: the same with the agreement flags
        continue-on-error: true
        timeout-minutes: 10
        run: |
          winget install --id Python.Python.3.12 -e --source winget --accept-source-agreements --accept-package-agreements --disable-interactivity
          "exit code: $LASTEXITCODE"
          "--- where it landed:"
          Get-ChildItem "$env:LOCALAPPDATA\Programs\Python" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
          Get-ChildItem 'C:\Program Files' -Filter 'Python3*' -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
          "--- does this same shell see it? python: $((Get-Command python -ErrorAction SilentlyContinue).Source) | py: $((Get-Command py -ErrorAction SilentlyContinue).Source)"
          "--- py launcher on disk: $(Test-Path 'C:\Windows\py.exe')"
      - name: move the machine's own Node.js away, then install it the way floored says
        continue-on-error: true
        timeout-minutes: 10
        run: |
          if (Test-Path 'C:\Program Files\nodejs') { Rename-Item 'C:\Program Files\nodejs' 'nodejs.away'; "moved the runner's Node.js away" }
          winget install --id OpenJS.NodeJS.LTS -e --source winget --accept-source-agreements --accept-package-agreements --disable-interactivity
          "exit code: $LASTEXITCODE"
          "--- where it landed: $(Test-Path 'C:\Program Files\nodejs\node.exe')"
          if (Test-Path 'C:\Program Files\nodejs\node.exe') { & 'C:\Program Files\nodejs\node.exe' --version }
      - name: ffmpeg the way floored says
        continue-on-error: true
        timeout-minutes: 10
        run: |
          winget install --id Gyan.FFmpeg -e --source winget --accept-source-agreements --accept-package-agreements --disable-interactivity
          "exit code: $LASTEXITCODE"
          "--- the links folder:"
          Get-ChildItem "$env:LOCALAPPDATA\Microsoft\WinGet\Links" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
          "--- the package folder:"
          Get-ChildItem "$env:LOCALAPPDATA\Microsoft\WinGet\Packages" -Filter 'Gyan.FFmpeg*' -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
          Get-ChildItem "$env:LOCALAPPDATA\Microsoft\WinGet\Packages" -Filter 'ffmpeg.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 3 -ExpandProperty FullName
      - name: the doctor on a PATH with no Python, Node.js or ffmpeg, started with the fresh Python by its full path
        continue-on-error: true
        timeout-minutes: 5
        run: |
          $clean = ($env:PATH -split ';' | Where-Object { $_ -and ($_ -notmatch 'python|nodejs|npm|ffmpeg|toolcache|chocolatey') }) -join ';'
          $env:PATH = $clean
          foreach ($t in 'python','py','node','npm','ffmpeg') { $c = Get-Command $t -ErrorAction SilentlyContinue; if ($c) { "$t -> $($c.Source)" } else { "$t -> (not found)" } }
          $py = Get-ChildItem "$env:LOCALAPPDATA\Programs\Python" -Filter 'python.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $py) { $py = Get-ChildItem 'C:\Program Files' -Filter 'Python3*' -ErrorAction SilentlyContinue | ForEach-Object { Join-Path $_.FullName 'python.exe' } | Where-Object { Test-Path $_ } | Select-Object -First 1 }
          "fresh python: $py"
          if ($py) { & $py plugin/skills/floored/app/floored.py doctor --json; "doctor exit code: $LASTEXITCODE" }

  probe-mac:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: what this machine has
        run: |
          sw_vers; uname -m
          echo "xcode-select -p: $(xcode-select -p 2>&1)"
          for t in python python3 pip3 brew node npm ffmpeg ffprobe git make clang curl tar shasum unzip hdiutil; do printf '%s -> ' "$t"; command -v "$t" || echo '(not found)'; done
          echo "--- PATH:"; echo "$PATH" | tr ':' '\n'
          echo "--- browsers:"; ls -d /Applications/*.app | grep -i -E "chrome|edge|brave|arc|firefox|safari" || echo "(none of those)"
          echo "--- Xcode and the command line tools:"; ls -d /Applications/Xcode*.app 2>/dev/null | head -8; ls /Library/Developer/CommandLineTools 2>/dev/null | head -5
          echo "--- /usr/bin/python3:"; ls -la /usr/bin/python3; /usr/bin/python3 --version
      - name: take the developer tools away, as on a Mac that never had them
        timeout-minutes: 10
        run: |
          sudo rm -rf /Library/Developer/CommandLineTools
          for x in /Applications/Xcode*.app; do [ -e "$x" ] && sudo mv "$x" "/private/tmp/$(basename "$x").away" || true; done
          echo "xcode-select -p: $(xcode-select -p 2>&1)"
          export PATH=/usr/bin:/bin:/usr/sbin:/sbin
          echo "--- with the bare system PATH:"
          for t in python python3 git make clang brew node npm ffmpeg curl tar shasum unzip hdiutil; do printf '%s -> ' "$t"; command -v "$t" || echo '(not found)'; done
          echo "--- /usr/bin/python3 --version (10 s limit):"
          ( /usr/bin/python3 --version 2>&1 & p=$!; ( sleep 10; kill $p 2>/dev/null ) & wait $p; echo "exit $?" ) || true
          echo "--- /usr/bin/git --version (10 s limit):"
          ( /usr/bin/git --version 2>&1 & p=$!; ( sleep 10; kill $p 2>/dev/null ) & wait $p; echo "exit $?" ) || true
      - name: a Python with no developer tools, no Homebrew and no password (a pinned standalone build)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          export PATH=/usr/bin:/bin:/usr/sbin:/sbin
          mkdir -p "$HOME/lab" && cd "$HOME/lab"
          ARCH=$(uname -m); [ "$ARCH" = arm64 ] && T=aarch64-apple-darwin || T=x86_64-apple-darwin
          URL="https://github.com/astral-sh/python-build-standalone/releases/download/20241016/cpython-3.12.7+20241016-$T-install_only.tar.gz"
          curl -fL --retry 2 -o py.tgz "$URL" && ls -la py.tgz && shasum -a 256 py.tgz
          tar -xzf py.tgz && ./python/bin/python3 --version
          ./python/bin/python3 -m venv venv && ./venv/bin/python -m pip --version
          ./venv/bin/python -m pip install --quiet numpy onnxruntime && ./venv/bin/python -c "import numpy, onnxruntime; print('numpy', numpy.__version__, 'onnxruntime', onnxruntime.__version__, onnxruntime.get_available_providers())"
          cd "$GITHUB_WORKSPACE" && "$HOME/lab/python/bin/python3" plugin/skills/floored/app/floored.py doctor --json; echo "doctor exit $?"
      - name: Node.js with no installer (the official archive)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          export PATH=/usr/bin:/bin:/usr/sbin:/sbin
          cd "$HOME/lab"
          ARCH=$(uname -m); [ "$ARCH" = arm64 ] && N=arm64 || N=x64
          curl -fL --retry 2 -o node.tgz "https://nodejs.org/dist/v22.12.0/node-v22.12.0-darwin-$N.tar.gz" && ls -la node.tgz
          curl -fsL "https://nodejs.org/dist/v22.12.0/SHASUMS256.txt" | grep "darwin-$N.tar.gz" ; shasum -a 256 node.tgz
          tar -xzf node.tgz && D="$HOME/lab/node-v22.12.0-darwin-$N/bin" && "$D/node" --version && PATH="$D:$PATH" npm --version
      - name: ffmpeg builds that need no Homebrew (which ones have what floored needs)
        continue-on-error: true
        timeout-minutes: 15
        run: |
          export PATH=/usr/bin:/bin:/usr/sbin:/sbin
          cd "$HOME/lab"
          check() { # name, folder with ffmpeg
            f="$2/ffmpeg"; [ -x "$f" ] || { echo "$1: no ffmpeg at $f"; return; }
            echo "== $1: $("$f" -version | head -1)"
            file "$f" | cut -c1-160
            "$f" -hide_banner -filters 2>/dev/null | grep -c -E "^ *[A-Z.]+ +zscale " | sed 's/^/   zscale: /'
            "$f" -hide_banner -encoders 2>/dev/null | grep -E " (libvpx-vp9|libx264|aac) " | sed 's/^/   /'
            "$f" -hide_banner -filters 2>/dev/null | grep -E " (loudnorm|ebur128|tonemap|amix) " | sed 's/^/   /'
            [ -x "$2/ffprobe" ] && echo "   ffprobe: yes" || echo "   ffprobe: NO"
          }
          ARCH=$(uname -m)
          echo "--- candidate A: martin-riedl.de static builds"
          mkdir -p a && cd a
          for tool in ffmpeg ffprobe; do curl -fL --retry 2 -o $tool.zip "https://ffmpeg.martin-riedl.de/redirect/latest/macos/$ARCH/release/$tool.zip" && unzip -o -q $tool.zip && ls -la $tool.zip; done
          cd .. ; check "martin-riedl" "$HOME/lab/a"
          echo "--- candidate B: the static-ffmpeg Python package"
          ./venv/bin/python -m pip install --quiet static-ffmpeg && ./venv/bin/python -c "import static_ffmpeg, shutil; static_ffmpeg.add_paths(); print(shutil.which('ffmpeg')); print(shutil.which('ffprobe'))" > b.txt 2>&1; cat b.txt
          B=$(dirname "$(sed -n 1p b.txt)"); check "static-ffmpeg" "$B"
          echo "--- candidate C: the imageio-ffmpeg Python package (ffmpeg only)"
          ./venv/bin/python -m pip install --quiet imageio-ffmpeg && C=$(./venv/bin/python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())") && echo "$C" && mkdir -p c && cp "$C" c/ffmpeg && check "imageio-ffmpeg" "$HOME/lab/c"
          echo "--- candidate D: evermeet.cx (Intel build; needs Rosetta on Apple chips)"
          mkdir -p d && cd d && curl -fL --retry 2 -o ffmpeg.zip "https://evermeet.cx/ffmpeg/getrelease/zip" && unzip -o -q ffmpeg.zip && curl -fL --retry 2 -o ffprobe.zip "https://evermeet.cx/ffmpeg/getrelease/ffprobe/zip" && unzip -o -q ffprobe.zip; cd ..; check "evermeet" "$HOME/lab/d"
          echo "--- is Rosetta here? $(/usr/bin/pgrep -q oahd && echo yes || echo no) ; arch -x86_64 /usr/bin/true: $(arch -x86_64 /usr/bin/true 2>&1 && echo ok)"
      - name: Chrome with no installer and no password (into the user's own Applications folder)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          export PATH=/usr/bin:/bin:/usr/sbin:/sbin
          cd "$HOME/lab"
          echo "Chrome already here: $(ls -d '/Applications/Google Chrome.app' 2>/dev/null || echo no)"
          curl -fL --retry 2 -o chrome.dmg "https://dl.google.com/chrome/mac/universal/stable/GGRO/googlechrome.dmg" && ls -la chrome.dmg
          hdiutil attach -nobrowse -quiet chrome.dmg && mkdir -p "$HOME/Applications" && cp -R "/Volumes/Google Chrome/Google Chrome.app" "$HOME/Applications/" && hdiutil detach -quiet "/Volumes/Google Chrome"
          "$HOME/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --version
