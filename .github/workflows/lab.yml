          New-Item -ItemType Directory -Force $away | Out-Null
          $manifest = Join-Path $away 'manifest.txt'
          function Away($p) {
            if (Test-Path -LiteralPath $p) {
              $dest = Join-Path $away (($p -replace '[:\\ ()]', '_'))
              try { Move-Item -LiteralPath $p -Destination $dest -ErrorAction Stop; "moved  $p"; "$p|$dest" | Add-Content $manifest }
              catch { "FAILED to move $p : $($_.Exception.Message)" }
            } else { "absent $p" }
          }
          $cands = @()
          $cands += Get-ChildItem 'C:\Program Files' -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '^(Python|nodejs|nvm|ffmpeg|Volta)' } | ForEach-Object FullName
          $cands += Get-ChildItem 'C:\Program Files (x86)' -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '^(Python|nodejs|ffmpeg)' } | ForEach-Object FullName
          $cands += "$env:LOCALAPPDATA\Programs\Python"
          $cands += "$env:LOCALAPPDATA\Microsoft\WinGet\Links"
          $cands += 'C:\ProgramData\chocolatey\lib\ffmpeg', 'C:\ProgramData\chocolatey\lib\nodejs', 'C:\ProgramData\chocolatey\lib\python3', 'C:\ProgramData\chocolatey\lib\python'
          $cands += 'C:\ProgramData\nvm', 'C:\npm', "$env:APPDATA\npm", "$env:APPDATA\nvm", "$env:LOCALAPPDATA\nvm"
          $cands += 'C:\ffmpeg', 'C:\Python3', 'C:\Python312', 'C:\Python311', 'C:\Python310'
          foreach ($tc in @($env:RUNNER_TOOL_CACHE, $env:AGENT_TOOLSDIRECTORY, 'C:\hostedtoolcache\windows') | Where-Object { $_ } | Select-Object -Unique) {
            "tool cache: $tc"
            $cands += Get-ChildItem $tc -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '^(Python|PyPy|node)' } | ForEach-Object FullName
          }
          foreach ($c in ($cands | Select-Object -Unique)) { Away $c }
          # single files left on PATH folders (py.exe launcher, chocolatey shims, ...)
          foreach ($d in ($env:PATH -split ';' | Where-Object { $_ -and (Test-Path -LiteralPath $_) } | Select-Object -Unique)) {
