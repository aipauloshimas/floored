# floored's automated checks on GitHub's standard runners (free on a public repo; never a larger runner).
# tests:   the fast Python suite, the engine's node tests and the studio's browser tests.
# install: a clean install through the doctor (the same --install steps SKILL.md runs), then the slow suite, which
#          cuts real takes with RVM and exports the sample. No secrets, no Claude login, nothing paid.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: ffmpeg (the full build, which the doctor asks for)
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew install ffmpeg-full
            echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
          else
            choco install ffmpeg -y --no-progress
          fi
      - name: dev venv
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" = Windows ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          echo "PY=$PY" >> "$GITHUB_ENV"
          $PY -m pip install --upgrade pip
          $PY -m pip install -r requirements.txt -r requirements-dev.txt
      - name: the studio server starts (stacks dumped if it hangs)
        continue-on-error: true
        run: $PY dev/ci/server_smoke.py
      - name: fast Python suite
        run: $PY -m pytest -v --tb=short -rfE --junitxml=pytest-fast.xml
      - name: node suite
        run: node --test tests/js/
      - name: browser suite (Chrome on macOS, Edge on Windows)
        run: |
          npm ci
          npx playwright test
      - name: keep the test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.os }}
          path: pytest-*.xml
          if-no-files-found: ignore

  install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    env:
      FT: plugin/skills/floored/app/floored.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # On macOS, Homebrew's slim ffmpeg on PATH plus the doctor's `brew install ffmpeg-full` (keg-only, off PATH): the
      # doctor must find and record the full build. The slow suite's own fixtures use the PATH one.
      - name: ffmpeg
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install ffmpeg ffmpeg-full; else choco install ffmpeg -y --no-progress; fi
      - name: doctor, before anything is installed
        run: python "$FT" doctor --json || true
      - name: doctor --install venv
        run: python "$FT" doctor --install venv
      - name: doctor --install packages
        run: python "$FT" doctor --install packages
      - name: doctor --install rvm-model
        run: python "$FT" doctor --install rvm-model
      - name: doctor --install renderer
        run: python "$FT" doctor --install renderer
      - name: doctor --install words
        run: python "$FT" doctor --install words
      - name: doctor, everything installed
        run: python "$FT" doctor --json
      - name: dev venv
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" = Windows ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          echo "PY=$PY" >> "$GITHUB_ENV"
          $PY -m pip install --upgrade pip
          $PY -m pip install -r requirements.txt -r requirements-dev.txt
      - name: slow suite (real cutouts, the sample export, 4K)
        run: $PY -m pytest -m slow -v --tb=short -rfE --durations=15 --junitxml=pytest-slow.xml
      - name: keep the test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-${{ matrix.os }}
          path: pytest-*.xml
          if-no-files-found: ignore
